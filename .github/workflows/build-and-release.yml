name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'  # 当推送版本标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Setup signing
      run: |
        # 创建签名密钥文件
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/wordflow-key.jks
        
        # 创建key.properties文件
        echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=../wordflow-key.jks" >> android/key.properties
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Get version from pubspec.yaml
      id: version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Generate release notes
      id: release_notes
      run: |
        # 获取最新的标签
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        # 如果存在CHANGELOG.md文件，尝试提取对应版本的更新内容
        if [ -f "CHANGELOG.md" ]; then
          # 提取当前版本的更新内容，支持多种版本格式
          RELEASE_NOTES=$(awk '
            /^## \[?v?${{ steps.version.outputs.version }}\]?/ { flag=1; next }
            /^## / && flag { flag=0 }
            flag && /^#### / { print $0; next }
            flag && /^- / { print $0; next }
            flag && NF > 0 { print $0 }
          ' CHANGELOG.md | sed '/^$/d')
          
          # 如果没有找到版本标题，尝试提取所有内容（适用于没有版本标题的情况）
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES=$(grep -E '^(####|-)' CHANGELOG.md | head -20)
          fi
        fi
        
        # 如果没有CHANGELOG.md或者没有找到对应版本，使用Git提交信息
        if [ -z "$RELEASE_NOTES" ]; then
          if [ -n "$LATEST_TAG" ]; then
            # 获取自上个标签以来的提交信息
            RELEASE_NOTES=$(git log $LATEST_TAG..HEAD --pretty=format:"- %s" --no-merges | head -20)
          else
            # 如果没有之前的标签，获取最近10个提交
            RELEASE_NOTES=$(git log --pretty=format:"- %s" --no-merges -10)
          fi
        fi
        
        # 如果还是没有内容，使用默认信息
        if [ -z "$RELEASE_NOTES" ]; then
          RELEASE_NOTES="- 版本更新
        - 性能优化
        - Bug修复"
        fi
        
        # 使用多行字符串输出，保持原始换行符
        {
          echo 'notes<<EOF'
          echo "$RELEASE_NOTES"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: WordFlow v${{ steps.version.outputs.version }}
        body: |
          ## WordFlow v${{ steps.version.outputs.version }}
          
          ### 更新内容
          ${{ steps.release_notes.outputs.notes }}
          
          ### 安装说明
          1. 下载APK文件
          2. 在Android设备上启用"未知来源"安装
          3. 安装APK文件
        draft: false
        prerelease: false
        
    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/app/outputs/flutter-apk/app-release.apk
        asset_name: app-release.apk
        asset_content_type: application/vnd.android.package-archive
